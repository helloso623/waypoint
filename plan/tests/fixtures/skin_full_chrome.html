<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Full chrome fixture</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/atelier.css">
  <link rel="stylesheet" href="/css/skin-feels.css">
  <link rel="stylesheet" href="/css/skin-fit.css">
  <link rel="stylesheet" href="/css/skin-icons.css">
  <style>
    html, body { min-height: 100%; }
    .view { display: none; }
    html[data-view="home"] #view-home { display: block; }
    html[data-view="planner"] #view-planner { display: block; }
    html[data-view="home"] #nav.tab-chip-bar { display: none !important; }
    .pln-canvas { padding: 12px 16px 24px; }
    .tdy-canvas-wrap { display: flex; flex-direction: column; max-width: 920px; }
    .pln-hour-row { display: flex; align-items: stretch; gap: 6px; }
    .tdy-hour-time { width: 38px; flex-shrink: 0; font-size: 10px; color: var(--ink-muted); padding: 2px 3px; }
    .pln-canvas .tdy-hour-cell { flex: 1; min-height: 22px; padding: 2px 6px; margin: 1px 0; border: 1px solid var(--border); border-radius: 6px; }
  </style>
</head>
<body data-workspace="home">
<div class="app-shell">
  <header class="top-hud" id="top-hud">
    <button type="button" class="hud-glyph-btn hud-brand-jewel" id="hud-home" title="Home" aria-label="Home">
      <svg class="brand-mark" width="24" height="24" viewBox="0 0 96 96" aria-hidden="true">
        <path d="M48 16 L84 76 H12 Z" fill="#c9a227" fill-opacity="0.22" stroke="#c9a227" stroke-width="5"/>
        <path d="M48 34 L64 64 H32 Z" fill="#e84a2f"/>
        <circle cx="48" cy="18" r="7" fill="#e84a2f"/>
      </svg>
    </button>
    <div class="hud-history">
      <button id="nav-back" class="nav-history-btn hud-icon-btn" type="button" title="Back" aria-label="Back"><svg class="hud-icon-svg" viewBox="0 0 24 24"><path d="M14.7 5.3a1 1 0 0 1 0 1.4L10.4 11H19a1 1 0 1 1 0 2h-8.6l4.3 4.3a1 1 0 0 1-1.4 1.4l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.4 0Z"/></svg></button>
      <button id="nav-forward" class="nav-history-btn hud-icon-btn" type="button" title="Forward" aria-label="Forward"><svg class="hud-icon-svg" viewBox="0 0 24 24"><path d="M9.3 5.3a1 1 0 0 1 1.4 0l6 6a1 1 0 0 1 0 1.4l-6 6a1 1 0 0 1-1.4-1.4l4.3-4.3H5a1 1 0 1 1 0-2h8.6L9.3 6.7a1 1 0 0 1 0-1.4Z"/></svg></button>
    </div>
    <div class="hud-title-block">
      <span class="hud-app-name" id="hud-app-name">Waypoint</span>
      <span class="hud-intention">Choose your world</span>
    </div>
    <div class="hud-spacer" aria-hidden="true"></div>
    <div class="hud-metrics">
      <button type="button" class="hud-status-pill" id="hud-status-pill">$— · 🔥—</button>
      <div class="hud-game-cluster" id="hud-game-cluster">
        <button type="button" class="hud-loot-cluster" id="hud-xp-btn" title="Open rewards and loot">
          <span class="hud-loot-coins" id="hud-coins-label">◉ —</span>
          <span class="hud-xp-level">Lv 1</span>
        </button>
        <button type="button" class="hud-quests-btn" id="hud-quests-btn" title="Daily quests">⚔ 0/3</button>
      </div>
      <button type="button" class="hud-chip hud-agent-chip" id="hud-agent-chip">Agent</button>
      <button type="button" class="hud-icon-btn" id="hud-pomodoro-btn" title="Pomodoro timer" aria-label="Pomodoro"><svg class="hud-icon-svg" viewBox="0 0 24 24"><path d="M9 2h6a1 1 0 1 1 0 2h-2v1.1A9 9 0 1 1 11 5.1V4H9a1 1 0 0 1 0-2Zm3 6a1 1 0 0 0-1 1v4.6l-2.2 2.2a1 1 0 1 0 1.4 1.4l2.5-2.5a1 1 0 0 0 .3-.7V9a1 1 0 0 0-1-1Z"/></svg></button>
      <button id="open-command-palette" class="hud-icon-btn" type="button" title="Command center" aria-label="Command center"><svg class="hud-icon-svg" viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6Zm3.3 3.3a1 1 0 0 0 0 1.4L9.6 13l-2.3 2.3a1 1 0 1 0 1.4 1.4l3-3a1 1 0 0 0 0-1.4l-3-3a1 1 0 0 0-1.4 0Z"/></svg></button>
      <button id="launch-automation-studio" class="hud-icon-btn" type="button" title="Automation Studio" aria-label="Automation Studio"><svg class="hud-icon-svg" viewBox="0 0 24 24"><path d="M5 3a3 3 0 0 1 2.8 2H11a1 1 0 0 1 1 1v5h4.2a3 3 0 1 1 0 2H12a1 1 0 0 1-1-1V7H7.8A3 3 0 1 1 5 3Z"/></svg></button>
      <button type="button" class="hud-icon-btn" id="hud-settings-btn" title="Settings" aria-label="Settings"><svg class="hud-icon-svg" viewBox="0 0 24 24"><path d="M10.3 2.5a1 1 0 0 1 1-.5h1.4a1 1 0 0 1 1 .8l.3 1.8c.6.2 1.1.5 1.6.9l1.7-.7a1 1 0 0 1 1.2.4l.7 1.2a1 1 0 0 1-.2 1.3l-1.4 1.2a7 7 0 0 1 0 1.8l1.4 1.2a1 1 0 0 1 .2 1.3l-.7 1.2a1 1 0 0 1-1.2.4l-1.7-.7c-.5.4-1 .7-1.6.9l-.3 1.8a1 1 0 0 1-1 .8h-1.4a1 1 0 0 1-1-.8L10 17.7a6 6 0 0 1-1.6-.9l-1.7.7a1 1 0 0 1-1.2-.4l-.7-1.2a1 1 0 0 1 .2-1.3l1.4-1.2a7 7 0 0 1 0-1.8L5 10.4a1 1 0 0 1-.2-1.3l.7-1.2a1 1 0 0 1 1.2-.4l1.7.7c.5-.4 1-.7 1.6-.9l.3-1.8ZM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg></button>
    </div>
  </header>
  <nav id="nav" class="tab-chip-bar tab-chip-bar--hidden" aria-label="Tabs">
    <button type="button" class="tab-chip active" data-tab="Today"><span class="tab-chip-emoji">☀️</span><span>Today</span></button>
    <button type="button" class="tab-chip" data-tab="Tasks"><span class="tab-chip-emoji">✅</span><span>Tasks</span></button>
    <button type="button" class="tab-chip" data-tab="Goals"><span class="tab-chip-emoji">🚩</span><span>Goals</span></button>
    <button type="button" class="tab-chip" data-tab="Calendar"><span class="tab-chip-emoji">📅</span><span>Calendar</span></button>
    <button type="button" class="tab-chip" data-tab="Events"><span class="tab-chip-emoji">🎟️</span><span>Events</span></button>
    <button type="button" class="tab-chip" data-tab="Paint"><span class="tab-chip-emoji">🖌️</span><span>Paint</span></button>
    <button type="button" class="tab-chip" data-tab="Trends"><span class="tab-chip-emoji">📈</span><span>Trends</span></button>
  </nav>
  <main id="main">
    <section id="view-home" class="view">
      <div class="launcher-stage" id="launcher-stage">
        <button type="button" class="launcher-card launcher-tile" data-app="agent"><div class="launcher-card-main"><span class="launcher-tile-glyph launcher-card-glyph"><span class="wp-app-emoji">🤖</span></span><span class="launcher-card-name">Agent</span></div></button>
        <button type="button" class="launcher-card launcher-tile" data-app="hub"><div class="launcher-card-main"><span class="launcher-tile-glyph launcher-card-glyph"><span class="wp-app-emoji">📌</span></span><span class="launcher-card-name">Hub</span></div></button>
        <button type="button" class="launcher-card launcher-tile" data-app="planner"><div class="launcher-card-main"><span class="launcher-tile-glyph launcher-card-glyph"><span class="wp-app-emoji">📅</span></span><span class="launcher-card-name">Planner</span></div></button>
        <button type="button" class="launcher-card launcher-tile" data-app="capture"><div class="launcher-card-main"><span class="launcher-tile-glyph launcher-card-glyph"><span class="wp-app-emoji">💡</span></span><span class="launcher-card-name">Capture</span></div></button>
        <button type="button" class="launcher-card launcher-tile" data-app="studio"><div class="launcher-card-main"><span class="launcher-tile-glyph launcher-card-glyph"><span class="wp-app-emoji">🛠️</span></span><span class="launcher-card-name">Studio</span></div></button>
        <button type="button" class="launcher-card launcher-tile" data-app="blueprint"><div class="launcher-card-main"><span class="launcher-tile-glyph launcher-card-glyph"><span class="wp-app-emoji">⬢</span></span><span class="launcher-card-name">Blueprint</span></div></button>
        <button type="button" class="launcher-card launcher-tile" data-app="arcade"><div class="launcher-card-main"><span class="launcher-tile-glyph launcher-card-glyph"><span class="wp-app-emoji">🎯</span></span><span class="launcher-card-name">Arcade</span></div></button>
        <button type="button" class="launcher-card launcher-tile" data-app="parallel"><div class="launcher-card-main"><span class="launcher-tile-glyph launcher-card-glyph"><span class="wp-app-emoji">🌌</span></span><span class="launcher-card-name">Parallel</span></div></button>
        <button type="button" class="launcher-card launcher-tile" data-app="people"><div class="launcher-card-main"><span class="launcher-tile-glyph launcher-card-glyph"><span class="wp-app-emoji">👥</span></span><span class="launcher-card-name">People</span></div></button>
        <button type="button" class="launcher-card launcher-tile" data-app="system"><div class="launcher-card-main"><span class="launcher-tile-glyph launcher-card-glyph"><span class="wp-app-emoji">⚙️</span></span><span class="launcher-card-name">System</span></div></button>
      </div>
    </section>
    <section id="view-planner" class="view">
      <main class="pln-canvas">
        <div class="tdy-canvas-wrap">
          <div class="pln-hour-row"><span class="tdy-hour-time">08:00</span><div class="tdy-hour-cell tdy-hour-painted" style="background:#163a6b"></div></div>
          <div class="pln-hour-row"><span class="tdy-hour-time">09:00</span><div class="tdy-hour-cell"></div></div>
          <div class="pln-hour-row"><span class="tdy-hour-time">10:00</span><div class="tdy-hour-cell"></div></div>
        </div>
      </main>
    </section>
  </main>
</div>
<aside id="wp-focus-dock" class="wp-focus-dock" aria-label="Focus drills">
  <button type="button" class="hud-icon-btn" id="wp-mini-math" title="Quick math"><svg class="hud-icon-svg" viewBox="0 0 24 24"><path d="M7 4h3v3h3v3H10v3H7v-3H4V7h3V4Z"/></svg></button>
  <button type="button" class="hud-icon-btn" id="wp-mini-memory" title="Memory"><svg class="hud-icon-svg" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 1 6 6c0 2.2-1.2 3.9-2.6 5.2H8.6C7.2 12.9 6 11.2 6 9a6 6 0 0 1 6-6Z"/></svg></button>
  <button type="button" class="hud-icon-btn" id="wp-set-alarm" title="Set alarm"><svg class="hud-icon-svg" viewBox="0 0 24 24"><path d="M12 7a7 7 0 1 1 0 14 7 7 0 0 1 0-14Z"/></svg></button>
</aside>
<script>
  document.documentElement.dataset.view = "home";
</script>
</body>
</html>
